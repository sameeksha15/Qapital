name: Deploy API

# After CI passes on main, update the API where it is hosted and wait until it answers with prices.
# The repository variable API_HOSTING picks the host:
#   modal   deploy/modal/app.py. Needs secrets MODAL_TOKEN_ID, MODAL_TOKEN_SECRET and variable API_URL.
#   oracle  deploy/oracle (a VM). Needs secret ORACLE_SSH_KEY and variables ORACLE_HOST, ORACLE_USER, API_URL
#           (all printed by deploy/oracle/setup.sh).
# The website deploys itself: Vercel watches the same branch (web/vercel.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  modal:
    if: >-
      vars.API_HOSTING == 'modal' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Deploy to Modal
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
        run: uv run --locked --extra api --with modal==1.6.0 modal deploy deploy/modal/app.py

  oracle:
    if: >-
      vars.API_HOSTING == 'oracle' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the VM
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
          USER: ${{ vars.ORACLE_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd ~/Qapital && git pull --ff-only && sudo docker compose -f deploy/oracle/compose.yml up -d --build && sudo docker image prune -f'

  check:
    needs: [modal, oracle]
    if: always() && (needs.modal.result == 'success' || needs.oracle.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Wait until the API answers with prices
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS -m 20 "$API_URL/health" || true)
            if echo "$body" | grep -q '"snapshot":"20'; then echo "live: $body"; exit 0; fi
            sleep 15
          done
          echo "The API didn't answer at $API_URL/health within 10 minutes (last answer: $body)"; exit 1
