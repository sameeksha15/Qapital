name: Deploy API

# After CI passes on main, push the API to its Hugging Face Space (a Docker Space) and wait until it answers.
# Needs: secret HF_TOKEN (a Hugging Face token with write access) and variable HF_SPACE ("owner/space-name").
# The website deploys itself: Vercel watches the same branch (web/vercel.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: true

jobs:
  space:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the Space (only what the API needs)
        run: |
          mkdir -p space/data
          cp -r Dockerfile .dockerignore pyproject.toml uv.lock src space/
          cp -r data/universes data/costs space/data/
          cp deploy/huggingface/README.md space/README.md
      - name: Push to Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          cd space
          git init -q -b main
          git config user.name "qapital deploy"
          git config user.email "deploy@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy ${GITHUB_SHA::7}"
          owner="${HF_SPACE%%/*}"
          git push -f "https://${owner}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" main
      - name: Wait until the live API answers with prices
        env:
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          host=$(echo "$HF_SPACE" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#; s#[._]#-#g')
          url="https://${host}.hf.space/health"
          for i in $(seq 1 60); do
            body=$(curl -fsS "$url" || true)
            if echo "$body" | grep -q '"snapshot":"20'; then echo "live: $body"; exit 0; fi
            sleep 20
          done
          echo "The API didn't come up at $url within 20 minutes (last answer: $body)"; exit 1
