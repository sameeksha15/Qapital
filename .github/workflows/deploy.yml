name: Deploy API

# After CI passes on main, update the API on the Oracle Cloud VM (deploy/oracle) and wait until it answers.
# Needs: secret ORACLE_SSH_KEY, variables ORACLE_HOST, ORACLE_USER and API_HOST (all printed by deploy/oracle/setup.sh).
# The website deploys itself: Vercel watches the same branch (web/vercel.json).
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  vm:
    if: >-
      vars.ORACLE_HOST != '' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    steps:
      - name: Pull and rebuild on the VM
        env:
          SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
          HOST: ${{ vars.ORACLE_HOST }}
          USER: ${{ vars.ORACLE_USER }}
        run: |
          install -m 600 /dev/null key && printf '%s\n' "$SSH_KEY" > key
          ssh -i key -o StrictHostKeyChecking=accept-new "$USER@$HOST" \
            'cd ~/Qapital && git pull --ff-only && sudo docker compose -f deploy/oracle/compose.yml up -d --build && sudo docker image prune -f'
      - name: Wait until the API answers with prices
        env:
          API_HOST: ${{ vars.API_HOST }}
        run: |
          for i in $(seq 1 40); do
            body=$(curl -fsS "https://$API_HOST/health" || true)
            if echo "$body" | grep -q '"snapshot":"20'; then echo "live: $body"; exit 0; fi
            sleep 15
          done
          echo "The API didn't answer at https://$API_HOST/health within 10 minutes (last answer: $body)"; exit 1
